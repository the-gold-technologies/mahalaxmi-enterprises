<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <rect width="120" height="120" rx="16" fill="#B71C1C"/>
  <circle cx="60" cy="60" r="50" fill="none" stroke="#FFD700" stroke-width="3"/>
  <!-- Crossed Swords -->
  <g stroke="#FFD700" stroke-width="5" stroke-linecap="round">
    <line x1="30" y1="90" x2="90" y2="30"/>
    <line x1="90" y1="90" x2="30" y2="30"/>
  </g>
  <!-- Sword Handles -->
  <circle cx="30" cy="90" r="5" fill="#FFD700"/>
  <circle cx="90" cy="90" r="5" fill="#FFD700"/>
  <!-- Star Crest -->
  <polygon points="60,25 64,38 78,38 67,46 71,60 60,51 49,60 53,46 42,38 56,38" fill="#FFD700"/>
  <text x="60" y="105" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="1">INDIAN ARMY</text>
</svg>